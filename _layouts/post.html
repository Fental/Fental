<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/post.css"/>
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/syntax.css"/>
</head>
<body>
  <!-- Dark Mode Toggle -->
  <button class="dark-mode-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode">
    <svg class="moon" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>

  <div class="page">
    <article>
      {{ content }}
    </article>

    {% if page.tags %}
    <div class="post-tags">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}

    <aside class="post-aside">
      <a href="{{ site.baseurl }}/">← 返回首页</a>
    </aside>

    <!-- Post Navigation -->
    {% if page.previous or page.next %}
    <nav class="post-navigation">
      {% if page.previous %}
      <a href="{{ site.baseurl }}{{ page.previous.url }}" class="post-nav-link post-nav-prev">
        <span class="nav-label">← 上一篇</span>
        <span class="nav-title">{{ page.previous.title }}</span>
      </a>
      {% endif %}

      {% if page.next %}
      <a href="{{ site.baseurl }}{{ page.next.url }}" class="post-nav-link post-nav-next">
        <span class="nav-label">下一篇 →</span>
        <span class="nav-title">{{ page.next.title }}</span>
      </a>
      {% endif %}
    </nav>
    {% endif %}

    <!-- Disqus Comments -->
    <div id="disqus_thread"></div>
    <noscript>
      Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>
    </noscript>
  </div>

  <!-- Back to Top Button -->
  <button class="back-to-top" onclick="scrollToTop()" aria-label="Back to top">
    <svg viewBox="0 0 24 24">
      <path d="M12 4l-8 8h6v8h4v-8h6z"/>
    </svg>
  </button>

  <script src="{{ site.baseurl }}/public/js/emojify.js"></script>
  <script src="{{ site.baseurl }}/public/js/public.js"></script>
  <script src="{{ site.baseurl }}/public/js/disqus.js"></script>
  <script src="{{ site.baseurl }}/public/js/ui-features.js"></script>
</body>
</html>
