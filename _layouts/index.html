<!DOCTYPE html>
<html lang="zh-CN" class="dark-mode">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ site.baseurl }}/public/css/enhanced.css"/>
</head>
<body>
  <!-- Dark Mode Toggle -->
  <button class="dark-mode-toggle" onclick="toggleDarkMode()" aria-label="Toggle dark mode">
    <svg class="moon" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
  </button>

  <div class="page">
    <header>
      <h1>{{ page.title }}</h1>
      <nav class="header-nav">
        <a href="{{ site.baseurl }}/search/">🔍 搜索</a>
        <a href="{{ site.baseurl }}/tags/">📂 标签</a>
      </nav>
    </header>

    <main>
      <h2>最新文章</h2>
      <ul class="post-list">
        {% for post in site.posts %}
        <li>
          <a href="{{ site.baseurl }}{{ post.url }}" class="post-card">
            <div class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</div>
            <h3 class="post-title">{{ post.title }}</h3>
            {% if post.tags %}
            <div class="post-tags">
              {% for tag in post.tags %}
              <span class="tag">{{ tag }}</span>
              {% endfor %}
            </div>
            {% endif %}
          </a>
        </li>
        {% endfor %}
      </ul>
    </main>

    <footer>
      <p style="color: var(--text-secondary); margin-top: 3em;">
        Built with <a href="https://jekyllrb.com" target="_blank">Jekyll</a> •
        Hosted on <a href="https://pages.github.com" target="_blank">GitHub Pages</a>
      </p>
    </footer>
  </div>

  <!-- Back to Top Button -->
  <button class="back-to-top" onclick="scrollToTop()" aria-label="Back to top">
    <svg viewBox="0 0 24 24">
      <path d="M12 4l-8 8h6v8h4v-8h6z"/>
    </svg>
  </button>

  <script src="{{ site.baseurl }}/public/js/ui-features.js"></script>
</body>
</html>
